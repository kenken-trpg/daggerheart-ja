name: Release

# Release を publish したときに、その Release へ module.json と module.zip を添付する。
#
# フォーク (kenken-trpg/daggerheart) ではこのイベントでワークフローが走らず、
# 成果物をローカルで作って手で添付していた。新しいリポジトリでは走るはずだが、
# 初回のリリースで実際に走ったかを必ず確認すること。走らない場合は
# 「ローカルでリリース成果物を作る手順」が lang/translation/README.md にある。

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # タグ (v は付けない) をそのままバージョンとして使う。
      - name: Read the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # check は上流の原文と突き合わせるので、参照用の原文を取る。
      # main ではなく module.json が verified と宣言しているシステム版に固定する。
      # 検査は「我々が対応すると言っているバージョン」に対して行うべきで、
      # 動いている上流に対して行うと無関係な失敗で赤くなる。
      - name: Fetch the upstream reference
        run: |
          ref=$(python3 -c "import json;print(json.load(open('module.json'))['relationships']['systems'][0]['compatibility']['verified'])")
          echo "pinning the reference to daggerheart $ref"
          npm run reference -- "$ref"

      # Witherwild 除外 (DPCGL 1.9.3) と enricher 保全を、配布物を作る前に検査する。
      # これを人間が手で走らせている限り「ビルドで強制」とは言えない。
      - name: Check the licence boundary before building
        run: npm run packs:check

      # module.json の version / download がタグと食い違ったまま配られると、
      # Foundry が更新を検出できなくなる。ここで揃える。
      - name: Point the manifest at this release
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          # タグ名は環境変数で受け取る。式展開でソースへ直接埋め込むと、
          # 引用符や改行を含むタグがこのスクリプトに注入できてしまう。
          # (そのコメント自体も書けない: Actions はファイル中のどこにあっても
          #  式の記法を解釈するので、ヒアドキュメントの中でも評価される。)
          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          with open("module.json") as f:
              manifest = json.load(f)
          manifest["version"] = version
          manifest["url"] = f"https://github.com/{repo}"
          manifest["manifest"] = f"https://raw.githubusercontent.com/{repo}/main/module.json"
          manifest["download"] = f"https://github.com/{repo}/releases/download/{version}/module.zip"
          # DPCGL 4.1 wants the notice reachable from what is shared; Foundry
          # shows these two as links on the module itself.
          manifest["readme"] = f"https://github.com/{repo}/blob/main/README.md"
          manifest["license"] = f"https://github.com/{repo}/blob/main/NOTICE"
          # hotReload は開発用。配布物に残すと利用者の環境で監視が走る。
          manifest.pop("flags", None)
          with open("module.json", "w") as f:
              json.dump(manifest, f, indent=4, ensure_ascii=False)
              f.write("\n")
          PY

      # 配布物は翻訳と CSS だけ。ビルドするものが無いので依存関係も要らない。
      - name: Build module.zip
        run: zip -r ./module.zip module.json lang/ja.json styles/ scripts/ babele/ README.md LICENSE NOTICE

      - name: Attach the files to the release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.unpublished }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json, ./module.zip'
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
