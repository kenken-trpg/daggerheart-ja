name: Check

# 訳文ファイルに対する検査を、リリースを待たずに毎コミットで走らせる。
#
# packs:check は Witherwild 除外 (DPCGL 1.9.3) と enricher/数値の保全を見る。
# どちらも配った後では直せない種類の間違いなので、ここで止める。
# Foundry も Babele も要らず、リポジトリ内のファイルだけで完結する。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Release guard regression tests
        run: npm run release:test
      - name: Require a new version for changed release files
        run: npm run release:check -- --allow-unreleased
      # check は上流の原文と突き合わせるので、参照用の原文を取る。
      # main ではなく module.json が verified と宣言しているシステム版に固定する。
      # 検査は「我々が対応すると言っているバージョン」に対して行うべきで、
      # 動いている上流に対して行うと無関係な失敗で赤くなる。
      - name: Fetch the upstream reference
        run: |
          ref=$(python3 -c "import json;print(json.load(open('module.json'))['relationships']['systems'][0]['compatibility']['verified'])")
          echo "pinning the reference to daggerheart $ref"
          npm run reference -- "$ref"

      - name: Licence boundary and enricher preservation
        run: npm run packs:check
      - name: Term agreement
        run: npm run packs:terms
